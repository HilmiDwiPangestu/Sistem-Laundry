<!doctype html>
<html lang="id">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#f3df00">
  <title>Sani Laundry - Offline</title>
  <style>
    *{box-sizing:border-box}body{margin:0;font-family:Arial,Helvetica,sans-serif;background:#f6f4ef;color:#24211f;min-height:100vh;display:grid;place-items:center;padding:24px}.card{width:min(430px,100%);background:#fff;border:1px solid #ddd7cd;border-radius:22px;padding:26px;box-shadow:0 18px 50px rgba(36,33,31,.10);text-align:center}.logo{width:86px;height:86px;border-radius:20px;margin:0 auto 16px;background:#f3df00;display:grid;place-items:center;overflow:hidden}.logo img{width:100%;height:100%;object-fit:cover}h1{font-size:24px;margin:0 0 8px}p{font-size:14px;line-height:1.55;color:#6f6862;margin:0 0 18px}.btn{display:inline-flex;align-items:center;justify-content:center;min-height:46px;padding:0 18px;border-radius:12px;border:1px solid #d1be00;background:#f3df00;color:#24211f;font-weight:800;text-decoration:none}.hint{margin-top:14px;font-size:11px;color:#8a827b}
  </style>
</head>
<body>
  <main class="card">
    <div class="logo"><img src="/static/pwa/icon-192.png" alt="Logo Sani Laundry"></div>
    <h1>Koneksi terputus</h1>
    <p>Aplikasi membutuhkan koneksi ke server Sani Laundry untuk membaca dan menyimpan data PostgreSQL.</p>
    <a class="btn" href="/">Coba Lagi</a>
    <div class="hint">Data tidak diubah selama perangkat sedang offline.</div>
  </main>
</body>
</html>
